<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>hermes contributions / social preview</title>
    <style>
      @font-face {
        font-family: display;
        src: url("./fonts/barlow-condensed-latin-300-normal.woff2");
      }
      @font-face {
        font-family: mono;
        src: url("./fonts/ibm-plex-mono-latin-400-normal.woff2");
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #1800ef;
        color: #f3f1e9;
        width: 1200px;
        height: 630px;
        padding: 18px;
        font-family: mono;
      }
      .frame {
        border: 1px solid #ffffff77;
        height: 100%;
        padding: 25px 30px;
        position: relative;
        overflow: hidden;
      }
      header {
        font-size: 14px;
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid #ffffff55;
        padding-bottom: 20px;
      }
      h1 {
        font: 300 128px/0.86 display;
        margin: 62px 0 24px;
        letter-spacing: -3px;
      }
      p {
        font-size: 13px;
        line-height: 1.8;
        max-width: 365px;
      }
      .stats {
        position: absolute;
        bottom: 26px;
        left: 30px;
        right: 30px;
        border-top: 1px solid #ffffff77;
        padding-top: 23px;
        display: flex;
        justify-content: space-between;
        font-size: 12px;
      }
      .stats strong {
        font-weight: 400;
        font-size: 25px;
        vertical-align: -3px;
        margin-right: 8px;
      }
      svg {
        position: absolute;
        right: 36px;
        top: 115px;
        width: 545px;
        height: 360px;
        overflow: visible;
      }
      svg path {
        fill: none;
        stroke: #f3f1e9;
        stroke-width: 0.75;
      }
      svg circle {
        fill: #f3f1e9;
      }
      svg text {
        fill: #f3f1e9;
        font: 10px mono;
      }
      small {
        font-size: 10px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <header>
        <span>mohamad kanso</span
        ><span>independent open-source contributor</span>
      </header>
      <h1>small fixes.<br />real impact.</h1>
      <p>a contribution record for<br />hermes agent / nous research</p>
      <svg viewBox="0 0 600 420" aria-label="contribution paths">
        <g id="lines"></g>
        <circle cx="555" cy="25" r="4" />
        <text x="564" y="29">main</text>
      </svg>
      <div class="stats" id="stats"></div>
    </div>
    <script type="module">
      const d = await (await fetch("./data/contributions.json")).json();
      document.querySelector("#lines").innerHTML = d.integrations
        .map((r, i) => {
          const y = 78 + i * 23,
            x = 35 + Math.cos(i * 0.4) * 25;
          return `<path d="M${x} ${y} C195 ${y},225 220,325 240 S480 170,555 25"/><circle cx="${x}" cy="${y}" r="2.5"/>`;
        })
        .join("");
      document.querySelector("#stats").innerHTML =
        `<span><strong>${d.metrics.landed}</strong> landed contributions</span><span><strong>${d.metrics.authoredMain + d.metrics.coauthoredMain}</strong> credited commits</span><span><strong>${d.metrics.prs}</strong> pull requests</span><small>verified september 2026</small>`;
    </script>
  </body>
</html>
